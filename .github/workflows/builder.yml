name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: false
        default: "HTML App"
      package_name:
        description: "Android package name"
        required: false
        default: "com.htmlfactory.app"

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_NAME: ${{ inputs.app_name || 'HTML App' }}
      PACKAGE_NAME: ${{ inputs.package_name || 'com.htmlfactory.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create Android WebView project
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

          PACKAGE_NAME="$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          if ! echo "$PACKAGE_NAME" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "Invalid package name, using default package."
            PACKAGE_NAME="com.htmlfactory.app"
          fi

          PROJECT_DIR="android-build"
          APP_DIR="$PROJECT_DIR/app"
          JAVA_DIR="$APP_DIR/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          rm -rf "$PROJECT_DIR" output
          mkdir -p "$JAVA_DIR"
          mkdir -p "$APP_DIR/src/main/assets/www"
          mkdir -p "$APP_DIR/src/main/res/values"

          rsync -a ./ "$APP_DIR/src/main/assets/www/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "android-build" \
            --exclude "output" \
            --exclude "*.apk" \
            --exclude "*.jks" \
            --exclude "*.keystore" \
            --exclude ".env"

          cat > "$PROJECT_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GeneratedWebViewApp"
          include ":app"
          EOF

          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > "$APP_DIR/build.gradle" <<EOF
          plugins {
              id "com.android.application"
          }

          android {
              namespace "$PACKAGE_NAME"
              compileSdk 35

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$APP_DIR/src/main/res/values/strings.xml" <<EOF
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

          cat > "$APP_DIR/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > "$APP_DIR/src/main/AndroidManifest.xml" <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package $PACKAGE_NAME;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android-build
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare final APK
        run: |
          mkdir -p output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk output/generated.apk
          ls -lh output/generated.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: output/generated.apk
          if-no-files-found: error
