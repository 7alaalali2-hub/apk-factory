name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: false
        default: "HTML App"
      package_name:
        description: "Android package name"
        required: false
        default: "com.htmlfactory.app"

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_NAME: ${{ inputs.app_name || 'HTML App' }}
      PACKAGE_NAME: ${{ inputs.package_name || 'com.htmlfactory.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create Android WebView project
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

          if [ -f "app_name.txt" ]; then
            APP_NAME="$(head -n 1 app_name.txt | tr -d '\r' | cut -c 1-80)"
            [ -n "$APP_NAME" ] || APP_NAME="HTML App"
          fi

          if [ -f "package_name.txt" ]; then
            PACKAGE_NAME="$(head -n 1 package_name.txt | tr -d '\r' | tr -d ' ')"
            [ -n "$PACKAGE_NAME" ] || PACKAGE_NAME="com.htmlfactory.app"
          fi

          PACKAGE_NAME="$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          if ! echo "$PACKAGE_NAME" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "Invalid package name, using default package."
            PACKAGE_NAME="com.htmlfactory.app"
          fi

          export APP_NAME PACKAGE_NAME

          ADBLOCK_ENABLED="false"
          if [ -f "adblock.enabled" ]; then
            ADBLOCK_ENABLED="true"
            echo "Native WebView ad blocker: enabled"
          else
            echo "Native WebView ad blocker: disabled"
          fi

          PROJECT_DIR="android-build"
          APP_DIR="$PROJECT_DIR/app"
          JAVA_DIR="$APP_DIR/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          rm -rf "$PROJECT_DIR" output
          mkdir -p "$JAVA_DIR"
          mkdir -p "$APP_DIR/src/main/assets/www"
          mkdir -p "$APP_DIR/src/main/res/values"
          mkdir -p "$APP_DIR/src/main/res/drawable"

          rsync -a ./ "$APP_DIR/src/main/assets/www/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "android-build" \
            --exclude "output" \
            --exclude "*.apk" \
            --exclude "*.jks" \
            --exclude "*.keystore" \
            --exclude ".env"

          if [ -f "app_icon.png" ]; then
            cp "app_icon.png" "$APP_DIR/src/main/res/drawable/app_icon.png"
          elif [ -f "app_icon.jpg" ]; then
            cp "app_icon.jpg" "$APP_DIR/src/main/res/drawable/app_icon.jpg"
          elif [ -f "app_icon.jpeg" ]; then
            cp "app_icon.jpeg" "$APP_DIR/src/main/res/drawable/app_icon.jpeg"
          else
            cat > "$APP_DIR/src/main/res/drawable/app_icon.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#38BDF8" android:pathData="M18,18h72v72h-72z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M30,48h48v12h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,30h12v48h-12z"/>
          </vector>
          EOF
          fi

          cat > "$PROJECT_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GeneratedWebViewApp"
          include ":app"
          EOF

          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > "$APP_DIR/build.gradle" <<EOF
          plugins {
              id "com.android.application"
          }

          android {
              namespace "$PACKAGE_NAME"
              compileSdk 35

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          APP_NAME_XML="$(python3 -c 'import html, os; print(html.escape(os.environ.get("APP_NAME", "HTML App"), quote=True))')"
          cat > "$APP_DIR/src/main/res/values/strings.xml" <<EOF
          <resources>
              <string name="app_name">$APP_NAME_XML</string>
          </resources>
          EOF

          cat > "$APP_DIR/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > "$APP_DIR/src/main/AndroidManifest.xml" <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package $PACKAGE_NAME;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import java.io.ByteArrayInputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final boolean ADBLOCK_BUILD_ENABLED = $ADBLOCK_ENABLED;

              private static final String[] BLOCKED_HOSTS = new String[] {
                      "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                      "adservice.google.com", "amazon-adsystem.com", "adnxs.com",
                      "adsrvr.org", "taboola.com", "outbrain.com", "criteo.com",
                      "scorecardresearch.com", "moatads.com", "rubiconproject.com",
                      "openx.net", "pubmatic.com", "popads.net", "popcash.net",
                      "propellerads.com", "revcontent.com", "zedo.com"
              };

              private static final String[] BLOCKED_URL_PARTS = new String[] {
                      "/ads/", "/adserver/", "/adservice/", "/advert/", "/analytics/",
                      "/banner/", "/banners/", "/popunder/", "/popup/",
                      "ad_tag", "adserver", "banner_ad", "interstitial", "preroll",
                      "vpaid", "vast"
              };

              private WebView webView;
              private SharedPreferences prefs;
              private boolean adBlockEnabled;
              private long blockedCount = 0;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("mrxboss_settings", MODE_PRIVATE);
                  adBlockEnabled = ADBLOCK_BUILD_ENABLED && prefs.getBoolean("adblock_enabled", true);

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);

                  if (android.os.Build.VERSION.SDK_INT >= 21) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.addJavascriptInterface(new AndroidBridge(), "MrXbossAndroid");
                  webView.setWebViewClient(new BlockingWebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          return false;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
              }

              private class AndroidBridge {
                  @JavascriptInterface
                  public boolean isAdBlockAvailable() {
                      return ADBLOCK_BUILD_ENABLED;
                  }

                  @JavascriptInterface
                  public boolean isAdBlockEnabled() {
                      return ADBLOCK_BUILD_ENABLED && adBlockEnabled;
                  }

                  @JavascriptInterface
                  public void setAdBlockEnabled(boolean enabled) {
                      if (!ADBLOCK_BUILD_ENABLED) {
                          adBlockEnabled = false;
                          return;
                      }
                      adBlockEnabled = enabled;
                      prefs.edit().putBoolean("adblock_enabled", enabled).apply();
                  }

                  @JavascriptInterface
                  public long getBlockedCount() {
                      return blockedCount;
                  }
              }

              private class BlockingWebViewClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                      if (request == null || request.getUrl() == null) return false;
                      String url = request.getUrl().toString();
                      if (isBlockedScheme(url) || shouldBlockUrl(url)) {
                          blockedCount++;
                          return true;
                      }
                      return false;
                  }

                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                      if (isBlockedScheme(url) || shouldBlockUrl(url)) {
                          blockedCount++;
                          return true;
                      }
                      return false;
                  }

                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      if (request != null && request.getUrl() != null && shouldBlockUrl(request.getUrl().toString())) {
                          blockedCount++;
                          return emptyResponse();
                      }
                      return super.shouldInterceptRequest(view, request);
                  }

                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                      if (shouldBlockUrl(url)) {
                          blockedCount++;
                          return emptyResponse();
                      }
                      return super.shouldInterceptRequest(view, url);
                  }
              }

              private boolean isBlockedScheme(String rawUrl) {
                  if (!ADBLOCK_BUILD_ENABLED || rawUrl == null) return false;
                  String url = rawUrl.toLowerCase(Locale.US);
                  return url.startsWith("intent:") || url.startsWith("market:");
              }

              private boolean shouldBlockUrl(String rawUrl) {
                  if (!ADBLOCK_BUILD_ENABLED || !adBlockEnabled || rawUrl == null) return false;

                  String url = rawUrl.toLowerCase(Locale.US);
                  Uri uri;
                  try {
                      uri = Uri.parse(url);
                  } catch (Exception ignored) {
                      return false;
                  }

                  String host = uri.getHost();
                  if (host == null) return false;
                  host = host.toLowerCase(Locale.US);
                  if (host.startsWith("www.")) host = host.substring(4);

                  for (String blockedHost : BLOCKED_HOSTS) {
                      if (host.equals(blockedHost) || host.endsWith("." + blockedHost)) {
                          return true;
                      }
                  }

                  for (String part : BLOCKED_URL_PARTS) {
                      if (url.contains(part)) {
                          return true;
                      }
                  }

                  return false;
              }

              private WebResourceResponse emptyResponse() {
                  return new WebResourceResponse(
                          "text/plain",
                          "utf-8",
                          new ByteArrayInputStream(new byte[0])
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android-build
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare final APK
        run: |
          mkdir -p output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk output/generated.apk
          ls -lh output/generated.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: output/generated.apk
          if-no-files-found: error
