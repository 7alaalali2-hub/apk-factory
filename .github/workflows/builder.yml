name: Ultimate APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools-version: '33.0.2'
          license-accepted: true

      - name: Create Complete Android Project Files
        run: |
          # 1. إنشاء ملف إعدادات الجذر الرئيسي
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. إنشاء ملف إعدادات الحزم الرئيسي
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MrXbossApp"
          include ':app'
          EOF

          # 3. تجهيز مجلدات التطبيق وملف الـ HTML
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mrxboss/app
          mkdir -p app/src/main/res/values

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1>MrXboss App</h1>" > app/src/main/assets/index.html
          fi

          # 4. إعدادات تطبيق أندرويد
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.mrxboss.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.mrxboss.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 5. ملف الواجهة الأساسي AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mrxboss.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Mr Xboss" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. كود تشغيل المتصفح الداخلي MainActivity
          cat << 'EOF' > app/src/main/java/com/mrxboss/app/MainActivity.java
          package com.mrxboss.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Final APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/MrXbossApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: output/MrXbossApp.apk
