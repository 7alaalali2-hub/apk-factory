name: Stable APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Create Web Wrapper APK
        run: |
          sudo apt-get update && sudo apt-get install -y zip default-jdk
          
          # تجهيز مجلد التطبيق البسيط
          mkdir -p workspace/assets
          if [ ! -f index.html ]; then
            echo "<h1>MrXboss App</h1>" > index.html
          fi
          cp index.html workspace/assets/index.html

          # إنشاء هيكل التطبيق الأساسي
          cd workspace
          cat << 'EOF' > AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mrxboss.app"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="MrXboss App" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ضغط الحزمة وتجهيزها للاستخدام
          zip -r ../app_raw.apk .
          cd ..

          # إنشاء مفتاح توقيع مؤقت وتوقيع التطبيق ليكون قابلاً للتثبيت الفوري
          keytool -genkey -v -keystore my-key.keystore -alias mykeyalias -keypass password -storepass password -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Dev,C=US"
          
          mkdir -p output
          cp app_raw.apk output/MrXbossApp.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: output/MrXbossApp.apk
