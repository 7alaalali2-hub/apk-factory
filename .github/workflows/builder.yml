name: Ultimate APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools-version: '33.0.2'
          license-accepted: true

      - name: Inject HTML into App
        run: |
          # التأكد من وجود مجلد الأصول ووضع الملف داخله مباشرة
          mkdir -p app/src/main/assets
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1>MrXboss App</h1>" > index.html
            cp index.html app/src/main/assets/index.html
          fi

      - name: Build APK with Gradle
        run: |
          # توليد ملفات التجميع المطلوبة أولاً لتجنب أي نقص
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Final APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/MrXbossApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: output/MrXbossApp.apk
