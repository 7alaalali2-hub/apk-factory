name: Ultimate APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Gradle & Build APK
        run: |
          # 1. تثبيت حزمة غردل مباشرة على السيرفر لتجنب أي نقص في الملفات
          sudo apt-get update && sudo apt-get install -y gradle

          # 2. تجهيز هيكل تطبيق أندرويد النظيف
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mrxboss/app
          mkdir -p app/src/main/res/values

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1>MrXboss App</h1>" > app/src/main/assets/index.html
          fi

          # 3. إعداد ملفات التكوين الأساسية
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "MrXbossApp"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.mrxboss.app"
                  minSdkVersion 21
                  targetSdkVersion 33
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mrxboss.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Mr Xboss" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mrxboss/app/MainActivity.java
          package com.mrxboss.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # 4. تنفيذ التجميع المباشر السريع
          gradle assembleDebug

      - name: Extract Final APK
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/MrXbossApp.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: output/MrXbossApp.apk
