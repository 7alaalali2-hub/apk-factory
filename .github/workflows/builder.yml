name: Build Real Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Project & Build APK
        run: |
          mkdir -p my-app/app/src/main/java/com/mrxboss/app
          mkdir -p my-app/app/src/main/assets
          mkdir -p my-app/app/src/main/res/values

          # نسخ كود الواجهة إلى مجلد الأصول الخاص بالتطبيق
          cp index.html my-app/app/src/main/assets/index.html

          # إعداد ملفات إعدادات المشروع
          cat << 'EOF' > my-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MrXbossApp"
          include ':app'
          EOF

          cat << 'EOF' > my-app/build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat << 'EOF' > my-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mrxboss.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.mrxboss.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mrxboss.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Mr Xboss"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > my-app/app/src/main/java/com/mrxboss/app/MainActivity.java
          package com.mrxboss.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd my-app
          gradle wrapper
          ./gradlew assembleDebug

      - name: Prepare Final APK
        run: |
          mkdir -p build_output
          cp my-app/app/build/outputs/apk/debug/app-debug.apk build_output/MrXbossApp.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: build_output/MrXbossApp.apk
